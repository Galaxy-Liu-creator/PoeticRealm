spring.application.name=backend
spring.config.import=optional:classpath:application-local.properties
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/poeticrealm?characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:poetic_realm}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
app.auth.remember-me-key=${REMEMBER_ME_KEY}
app.auth.secure-cookie=${COOKIE_SECURE:false}
