<style data-purpose="ambient-effects">
    @keyframes snowfall {
      0% {
        transform: translate3d(0, -10px, 0);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.6;
      }
      100% {
        transform: translate3d(-180px, 100vh, 0);
        opacity: 0;
      }
    }

    .snowflake {
      position: absolute;
      top: -20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      filter: blur(0.6px);
      animation-name: snowfall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
  </style>
