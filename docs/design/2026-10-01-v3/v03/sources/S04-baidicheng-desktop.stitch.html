<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>诗境·一卷山河 - S04 早发白帝城诗境</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for High-Fidelity Chinese Calligraphy & Serif Typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=Noto+Serif+SC:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cinnabar: '#9F493D',     /* 经典朱砂红印泥色 */
            qingdai: '#183236',      /* 深青黛色 */
            silk: '#DDE3DA',         /* 青灰绢帛色 */
            mountain: '#365C55',     /* 远山苍翠 */
          },
          fontFamily: {
            calligraphy: ['"Ma Shan Zheng"', 'cursive', 'serif'],
            serif: ['"Noto Serif SC"', '"Songti SC"', '"Source Han Serif SC"', 'serif'],
          }
        }
      }
    };
  </script>
<!-- Custom Styles for Classical Vertical Typography & Calligraphic Aesthetics -->
<style data-purpose="typography">
    .vertical-rl {
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.38em;
    }
    .poetic-shadow {
      text-shadow: 0 2px 14px rgba(10, 24, 28, 0.7), 0 0 3px rgba(0, 0, 0, 0.4);
    }
    .seal-shadow {
      box-shadow: 0 2px 8px rgba(159, 73, 61, 0.35);
    }
  </style>
<style data-purpose="layout">
    /* Subtle wave sound equalizer animation */
    @keyframes soundwave {
      0%, 100% { height: 4px; }
      50% { height: 13px; }
    }
    .wave-bar-1 { animation: soundwave 1.1s ease-in-out infinite; }
    .wave-bar-2 { animation: soundwave 0.85s ease-in-out infinite 0.2s; }
    .wave-bar-3 { animation: soundwave 1.25s ease-in-out infinite 0.4s; }
  </style>
</head>
<body class="m-0 p-0 w-full h-screen overflow-hidden bg-[#183236] font-serif text-[#DDE3DA] select-none">
<!-- BEGIN: ImmersiveSceneContainer -->
<!-- Fullscreen Photographic Canvas with Baidi City Yangtze Gorges Background -->
<div class="relative w-full h-full overflow-hidden flex flex-col justify-between" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDGIUhwww7bOHjSTfRFPUDem_uFfOuQiWxcGhHSf0MjAyGOCbeAkVBrAUPB0cMKXc3hks2PrOXAKQB-jpH_MXm7_vfUB5kXUHv0Of3BisfPjxLQR_QECnAgWeRBM3iYpxLTRqhG4G5lKZNEiOdk4O9OpZwQssSTwTu1dm1XMVi3BJqdi6IlJksT3R8TMFmE6b2qQYdsmgOVZSRMtYEHDYOfBb6a7ZZiHCsdhh5olg4sv3UrUO6wgsFn42-tqcEUFP9BYtL-Lv_0b5ES'); background-size: cover; background-position: center center;">
<!-- Subtle Ambient Vignette & Fog Gradient Overlays to preserve legibility without breaking realism -->
<div class="absolute inset-0 pointer-events-none bg-gradient-to-b from-[#183236]/80 via-[#183236]/20 to-[#183236]/70"></div>
<div class="absolute inset-0 pointer-events-none bg-radial-vignette opacity-40 mix-blend-multiply" style="background: radial-gradient(circle at 40% 40%, transparent 45%, rgba(15, 30, 33, 0.8) 100%);"></div>
<!-- BEGIN: TopNavigationBar -->
<header class="relative z-20 flex items-center justify-between px-10 pt-7 text-xs font-light text-[#DDE3DA]/80 tracking-widest">
<!-- Left: Navigation & Brand Landmark -->
<div class="flex items-center space-x-4">
<a class="flex items-center space-x-1.5 hover:text-white transition-colors duration-200 cursor-pointer group" href="javascript:void(0)" title="返回全卷画册">
<svg class="w-4 h-4 transform group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path>
</svg>
<span class="tracking-widest">返回总览</span>
</a>
<span class="text-[#DDE3DA]/30 font-thin select-none">|</span>
<!-- Brand Name with Calligraphic Stroke Touch -->
<span class="font-calligraphy text-xl tracking-[0.25em] text-[#F3F6F1] drop-shadow-sm">诗境 · 一卷山河</span>
<!-- Volume Identification Seal Badge -->
<span class="text-[11px] px-2 py-0.5 rounded-[4px] border border-[#DDE3DA]/35 bg-[#183236]/40 text-[#DDE3DA]/90 tracking-wider">
          三峡卷
        </span>
</div>
<!-- Right: Functional Controls -->
<div class="flex items-center space-x-4">
<!-- Ambient Sound Controller Capsule -->
<button class="flex items-center space-x-2.5 px-3.5 py-1.5 rounded-[4px] bg-[#183236]/60 border border-[#DDE3DA]/20 hover:border-[#DDE3DA]/45 hover:bg-[#183236]/80 text-[#DDE3DA] transition-all backdrop-blur-sm cursor-pointer shadow-sm" data-purpose="ambient-sound-toggle" id="soundToggle" type="button">
<div aria-hidden="true" class="flex items-end space-x-[2.5px] h-3.5 pb-0.5">
<span class="w-[2px] bg-[#DDE3DA]/90 rounded-full wave-bar-1"></span>
<span class="w-[2px] bg-[#DDE3DA]/90 rounded-full wave-bar-2"></span>
<span class="w-[2px] bg-[#DDE3DA]/90 rounded-full wave-bar-3"></span>
</div>
<span class="text-[11px] tracking-widest font-normal text-[#DDE3DA]/95">两岸猿啼 · 声音已启</span>
</button>
<!-- Red Cinnabar Bookmark Action Button -->
<button class="flex items-center space-x-1.5 px-4 py-1.5 rounded-[4px] bg-[#9F493D] hover:bg-[#B35246] active:bg-[#8D3F34] text-white transition-all duration-150 cursor-pointer shadow-md seal-shadow text-[11px] font-medium tracking-wider" data-purpose="favorite-button" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span>收藏本诗</span>
</button>
<!-- User Profile Center Link -->
<a class="flex items-center space-x-1 hover:text-white transition-colors duration-200 text-[#DDE3DA]/80 pl-1" href="javascript:void(0)">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
<span class="text-[11px] tracking-wider">个人中心</span>
</a>
</div>
</header>
<!-- END: TopNavigationBar -->
<!-- BEGIN: MainPoeticContent -->
<!-- Positioned naturally in the high-altitude morning cloud & airy breathing zone on the upper-left canyon mist -->
<main class="relative z-10 flex-1 px-14 lg:px-24 pt-8 lg:pt-12 select-none pointer-events-none">
<div class="inline-flex flex-row-reverse items-start space-x-reverse space-x-8 lg:space-x-14">
<!-- Title and Author Column -->
<div class="flex flex-col items-center vertical-rl text-center">
<!-- Main Poem Title -->
<h1 class="font-serif text-4xl lg:text-[44px] font-medium text-white tracking-[0.24em] poetic-shadow leading-none">
            早发白帝城
          </h1>
<!-- Author Info & Red Seal (Aligned vertically below title) -->
<div class="mt-8 flex flex-col items-center">
<span class="text-xs tracking-[0.3em] text-[#DDE3DA]/80 font-light mb-3">
              唐 · 李白
            </span>
<!-- Red Square Seal "太白" -->
<div class="w-5 h-6 rounded-[2px] border border-[#9F493D] text-[#9F493D] flex items-center justify-center text-[10px] leading-tight font-serif bg-[#183236]/40 select-none shadow-sm" style="font-family: 'Noto Serif SC', serif;">
              太白
            </div>
</div>
</div>
<!-- Four Lines of Poetry arranged vertically in traditional Right-to-Left column flow -->
<div class="flex flex-row-reverse space-x-reverse space-x-6 lg:space-x-10 text-white font-serif text-2xl lg:text-[29px] leading-relaxed poetic-shadow">
<!-- Line 1: 朝辞白帝彩云间 -->
<div class="vertical-rl tracking-[0.42em] font-normal text-white/95">
            朝辞白帝彩云间
          </div>
<!-- Line 2: 千里江陵一日还 -->
<div class="vertical-rl tracking-[0.42em] font-normal text-white/95">
            千里江陵一日还
          </div>
<!-- Line 3: 两岸猿声啼不住 -->
<div class="vertical-rl tracking-[0.42em] font-normal text-white/95">
            两岸猿声啼不住
          </div>
<!-- Line 4: 轻舟已过万重山 -->
<div class="vertical-rl tracking-[0.42em] font-normal text-white/95">
            轻舟已过万重山
          </div>
</div>
</div>
</main>
<!-- END: MainPoeticContent -->
<!-- BEGIN: FooterAnnotations -->
<!-- Minimalist bottom footer matching S02/S03 spatial balance -->
<footer class="relative z-20 flex items-center justify-between px-12 pb-7 text-[12px] font-light text-[#DDE3DA]/65 tracking-widest select-none">
<!-- Historical Context & Poetic Concept Quote -->
<div class="flex items-center space-x-3">
<span class="w-6 h-[1px] bg-[#DDE3DA]/40 inline-block"></span>
<span>唐·乾元二年 李白遇赦还乡作 · 激荡豪迈出峡之境</span>
</div>
<!-- Geographical & Atmospheric Micro-badge -->
<div class="flex items-center space-x-2 text-[11px] text-[#DDE3DA]/75">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-[#E5B583]/80 animate-pulse"></span>
<span>奉节夔门 · 晨霞初照</span>
</div>
</footer>
<!-- END: FooterAnnotations -->
</div>
<!-- END: ImmersiveSceneContainer -->
<!-- Interactive Sound State Switcher Script -->
<script data-purpose="sound-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const soundBtn = document.getElementById('soundToggle');
      let isPlaying = true;

      if (soundBtn) {
        soundBtn.addEventListener('click', () => {
          isPlaying = !isPlaying;
          const label = soundBtn.querySelector('span:last-child');
          const bars = soundBtn.querySelectorAll('span[class*="wave-bar-"]');

          if (isPlaying) {
            label.textContent = '两岸猿啼 · 声音已启';
            soundBtn.classList.remove('opacity-60');
            bars.forEach(bar => bar.classList.remove('h-[2px]', 'animate-none'));
          } else {
            label.textContent = '两岸猿啼 · 声音已静';
            soundBtn.classList.add('opacity-60');
            bars.forEach(bar => {
              bar.style.height = '2px';
              bar.classList.add('animate-none');
            });
          }
        });
      }
    });
  </script>
</body></html>
