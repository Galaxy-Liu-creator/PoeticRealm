<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诗境 · 一卷山河</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      #stage, #ui { display: none; }
      body.legacy { height: 100%; overflow: hidden; background: #000; }
      .legacy #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .legacy #ui { display: block; position: fixed; inset: 0; pointer-events: none; }
      #ui[data-state='error'] {
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #e9dfcf;
        font: 1rem/1.8 serif;
        letter-spacing: 0.08em;
        text-align: center;
      }
      #ui[data-state='hint'] {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        box-sizing: border-box;
        padding: 0 1.5rem 1.5rem;
        color: rgba(233, 223, 207, 0.76);
        font: 0.875rem/1.6 serif;
        letter-spacing: 0.12em;
        text-shadow: 0 1px 2px #17191a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <canvas id="stage"></canvas>
    <div id="ui" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
